name: Maquettes sur GitHub Pages

on:
  push:
    branches: [maquettes-home]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Upload de l'artefact (dossier maquettes)
        uses: actions/upload-pages-artifact@v3
        with:
          path: maquettes

      - name: Déploiement sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
