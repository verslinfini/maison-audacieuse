# Fabrication des zips televersables dans l admin WordPress.
#
# Voie B du plan de deploiement : le plan de secours quand SSH n est pas disponible
# (cle revoquee, acces perdu, panne du workflow deploy.yml). Voir docs/deploiement.md.
# Se declenche sur un tag de version : git tag v1.0.0 && git push origin v1.0.0

name: Zips de release (voie sans SSH)

on:
  push:
    tags:
      - 'v*'

# Ecriture necessaire pour creer la release et y attacher les fichiers.
permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Fabriquer les archives
        id: zips
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA=$(git rev-parse --short HEAD)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Meme tampon de build que le deploiement par SSH : la sonde de derive
          # (wp-drift.mjs) doit pouvoir reconnaitre la version servie, quelle que soit la voie.
          printf '%s\n' "$SHA" > theme/kadence-child/build.txt

          # Le zip d un theme WordPress doit contenir le dossier du theme a sa racine,
          # sinon le televersement depuis l admin echoue.
          (cd theme && zip -r "../kadence-child-$TAG.zip" kadence-child -x '*.DS_Store' '*Thumbs.db')

          # Les mu-plugins ne passent pas par le televerseur d extensions : leur contenu
          # se depose directement dans wp-content/mu-plugins (gestionnaire de fichiers cPanel ou FTP).
          (cd mu-plugins && zip -r "../lma-core-$TAG.zip" . -x '*.DS_Store' '*Thumbs.db' '.gitkeep')

          ls -lh ./*.zip

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.zips.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "kadence-child-$TAG.zip" \
            "lma-core-$TAG.zip" \
            --title "$TAG" \
            --notes "Archives televersables depuis l admin WordPress (voie B, sans SSH).

          - kadence-child-$TAG.zip : Apparence > Themes > Ajouter > Televerser un theme.
          - lma-core-$TAG.zip : a decompresser dans wp-content/mu-plugins (gestionnaire de fichiers cPanel ou FTP), pas par le televerseur d extensions.

          Sauvegarde JetBackup avant toute installation. Procedure complete : docs/deploiement.md, plan de retour : docs/rollback.md."
